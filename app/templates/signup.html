<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create your account – Business AI</title>
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-output.css') }}">
</head>

<body class="auth-page">

    <a href="/" class="auth-back" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to home
    </a>

    <main class="auth-shell">

        <div class="auth-card auth-card-wide" data-auth-enter>

            <a href="/" class="auth-brand text-xl font-semibold text-gray-900" aria-label="Business AI home">
                <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="8" fill="#2563eb"/>
                    <path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Business AI
            </a>

            <div class="auth-heading">
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtext">Start connecting your tools to one command center.</p>
            </div>

            <form class="auth-form" id="signupForm" novalidate>

                <div class="field" data-field="name">
                    <label for="name" class="field-label">Name</label>
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="name" name="name" autocomplete="name" placeholder="Jane Smith">
                    </div>
                    <span class="field-error" role="alert"></span>
                </div>

                <div class="field" data-field="business">
                    <label for="business" class="field-label">Business name</label>
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        </svg>
                        <input type="text" id="business" name="business" placeholder="Smith &amp; Co.">
                    </div>
                    <span class="field-error" role="alert"></span>
                </div>

                <div class="field" data-field="email">
                    <label for="email" class="field-label">Email address</label>
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input type="email" id="email" name="email" inputmode="email" autocomplete="email" placeholder="you@company.com">
                    </div>
                    <span class="field-error" role="alert"></span>
                </div>

                <div class="field" data-field="password">
                    <label for="password" class="field-label">Password</label>
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 8 characters">
                        <button type="button" class="password-toggle" data-password-toggle data-target="password" aria-label="Show password">
                            <svg class="eye eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" role="alert"></span>
                    <p class="field-hint">Use 8 or more characters with a mix of letters and numbers.</p>
                </div>

                <div class="field" data-field="confirm">
                    <label for="confirm" class="field-label">Confirm password</label>
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="Re-enter your password">
                        <button type="button" class="password-toggle" data-password-toggle data-target="confirm" aria-label="Show password">
                            <svg class="eye eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" role="alert"></span>
                </div>

                <label class="auth-check auth-check-terms">
                    <input type="checkbox" name="terms">
                    <span class="auth-check-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                    <span class="auth-terms-text">I agree to the
                        <a href="#" class="auth-link">Terms of Service</a> and
                        <a href="#" class="auth-link">Privacy Policy</a>
                    </span>
                </label>
                <p class="field-error" id="termsError" role="alert"></p>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>

                <p class="auth-foot">Already have an account?
                    <a href="/login" class="auth-link">Sign in</a>
                </p>

            </form>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
